<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OC 花谱鉴定 · 测测你的 OC 是哪一种花</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  /* ===== 设计 token ===== */
  :root {
    --paper: #F2EEE3;
    --paper-deep: #E9E3D3;
    --ink: #2A2A24;
    --ink-soft: #55544A;
    --pine: #28352C;
    --pine-soft: #435447;
    --gold: #A98F4F;
    --line: #D6CFBC;
    --card: #FBF8F0;
    --shadow: 0 18px 40px rgba(40, 53, 44, 0.14);
    --radius: 18px;
    --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(169, 143, 79, 0.08), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(40, 53, 44, 0.08), transparent 46%);
  }

  button { font-family: inherit; cursor: pointer; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 22px 64px;
  }

  /* ===== 视图切换 ===== */
  .view { display: none; animation: fadeIn 0.45s ease; }
  .view.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .view.active { animation: none; }
    * { transition: none !important; }
  }

  /* ===== 首页 ===== */
  .home-header { text-align: center; padding: 24px 0 8px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .eyebrow::before, .eyebrow::after {
    content: "";
    width: 28px; height: 1px;
    background: var(--gold);
  }

  .home-title {
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(38px, 8vw, 56px);
    letter-spacing: 0.06em;
    color: var(--pine);
    line-height: 1.2;
  }

  .home-sub {
    margin-top: 18px;
    color: var(--ink-soft);
    font-size: 15.5px;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }

  .home-art {
    margin: 34px auto 0;
    width: min(300px, 78vw);
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .home-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .name-panel {
    margin-top: 38px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 24px;
    box-shadow: var(--shadow);
  }
  .name-panel label {
    display: block;
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--pine-soft);
    margin-bottom: 12px;
  }
  .name-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .name-row input {
    flex: 1 1 200px;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    font-family: var(--sans);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .name-row input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(169, 143, 79, 0.18);
  }

  .primary-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--pine);
    color: var(--paper);
    border: none;
    border-radius: 12px;
    padding: 15px 28px;
    font-size: 16px;
    letter-spacing: 0.12em;
    transition: background 0.2s, transform 0.15s;
  }
  .primary-btn:hover { background: var(--pine-soft); }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .home-notes {
    margin-top: 26px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    text-align: center;
  }
  .note {
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 14px 8px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .note strong {
    display: block;
    font-family: var(--serif);
    font-size: 18px;
    color: var(--pine);
    margin-bottom: 2px;
  }

  /* ===== 答题页 ===== */
  .quiz-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .quiz-count {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--pine-soft);
    letter-spacing: 0.1em;
  }
  .quiz-count b { color: var(--gold); font-size: 20px; }

  .progress {
    flex: 1;
    margin-left: 20px;
    height: 6px;
    background: var(--paper-deep);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0;
    background: var(--gold);
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .question {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(22px, 5vw, 28px);
    color: var(--pine);
    line-height: 1.5;
    margin: 18px 0 26px;
  }

  .options { display: flex; flex-direction: column; gap: 14px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    font-size: 15.5px;
    color: var(--ink);
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .option:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(40, 53, 44, 0.1);
  }
  .option:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .option .mark {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border: 1px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 14px;
    color: var(--pine-soft);
    background: var(--paper);
  }

  .quiz-foot {
    margin-top: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ghost-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 10px;
  }
  .ghost-btn:hover { color: var(--pine); background: var(--paper-deep); }
  .ghost-btn:disabled { opacity: 0.35; cursor: default; }

  /* ===== 结果页 ===== */
  .result-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .result-hero {
    position: relative;
    padding: 30px 26px 0;
    text-align: center;
  }
  .result-index {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    letter-spacing: 0.24em;
    color: var(--gold);
  }
  .result-name {
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(30px, 7vw, 40px);
    color: var(--pine);
    margin-top: 8px;
  }
  .result-latin {
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-top: 4px;
  }
  .result-img {
    margin: 22px auto 0;
    width: min(260px, 70vw);
    aspect-ratio: 1;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--paper);
  }
  .result-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .result-body { padding: 28px 26px 30px; }

  .flower-lang {
    display: inline-block;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: var(--paper);
    margin-bottom: 20px;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .tag {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--pine-soft);
    background: var(--paper);
  }

  .result-section-title {
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin: 20px 0 10px;
  }
  .result-profile { font-size: 15.5px; color: var(--ink); }

  .verdict {
    margin-top: 24px;
    padding: 18px 20px;
    border-left: 3px solid var(--gold);
    background: var(--paper);
    border-radius: 0 16px 16px 0;
    font-family: var(--serif);
    font-size: 17px;
    color: var(--pine);
  }

  .advice {
    margin-top: 16px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .advice b { color: var(--pine-soft); }

  .result-actions {
    margin-top: 28px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .secondary-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--pine);
    border-radius: 12px;
    padding: 15px 24px;
    font-size: 15px;
    letter-spacing: 0.08em;
    transition: border-color 0.2s;
  }
  .secondary-btn:hover { border-color: var(--gold); }

  .result-oc-name {
    text-align: center;
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 18px;
  }
  .result-oc-name b { color: var(--pine); }

  /* ===== 页脚 ===== */
  .footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }

  /* ===== 窄屏 ===== */
  @media (max-width: 560px) {
    .wrap { padding: 22px 16px 48px; }
    .home-notes { grid-template-columns: 1fr; }
    .result-actions { flex-direction: column; }
    .result-actions .primary-btn,
    .result-actions .secondary-btn { width: 100%; }
  }
</style>
</head>

<div class="wrap">

        <div class="tags" id="result-tags"></div>

        <h3 class="result-section-title">花相解析</h3>
        <p class="result-profile" id="result-profile"></p>

        <div class="verdict" id="result-verdict"></div>

        <p class="advice" id="result-advice"></p>
      </div>
    </div>

    <p class="result-oc-name">这株花，属于 <b id="result-oc-name"></b></p>

    <div class="result-actions">
      <button class="primary-btn" id="retry-btn">重新鉴定</button>
      <button class="secondary-btn" id="home-btn">返回花谱首页</button>
    </div>

    <p class="footer">若想换个角度重测，可随时回到首页</p>
  </section>

</div>

/* ===== 应用状态 ===== */
var state = {
  current: 0,
  scores: {},
  answers: [],
  ocName: ""
};

/* ===== 视图工具 ===== */
function showView(id) {
  var views = document.querySelectorAll(".view");
  for (var i = 0; i < views.length; i++) {
    views[i].classList.remove("active");
  }
  document.getElementById(id).classList.add("active");
  window.scrollTo({ top: 0, behavior: "auto" });
}

function resetState() {
  state.current = 0;
  state.scores = {};
  state.answers = [];
  for (var k in FLOWERS) state.scores[k] = 0;
}

/* ===== 答题渲染 ===== */
function renderQuiz() {
  var q = QUESTIONS[state.current];
  document.getElementById("q-now").textContent = state.current + 1;
  document.getElementById("q-total").textContent = QUESTIONS.length;
  document.getElementById("progress-bar").style.width = ((state.current) / QUESTIONS.length * 100) + "%";
  document.getElementById("question-text").textContent = q.text;

  var box = document.getElementById("options");
  box.innerHTML = "";
  var marks = ["甲", "乙", "丙", "丁"];

  q.options.forEach(function (opt, idx) {
    var btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";

    var mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = marks[idx];

    var txt = document.createElement("span");
    txt.textContent = opt.text;

    btn.appendChild(mark);
    btn.appendChild(txt);
    btn.addEventListener("click", function () { chooseOption(opt); });
    box.appendChild(btn);
  });

  document.getElementById("prev-btn").disabled = state.current === 0;
}

function chooseOption(opt) {
  /* 记录本次选择并计分 */
  state.answers[state.current] = opt;
  for (var k in opt.score) {
    state.scores[k] += opt.score[k];
  }
  state.current += 1;

  if (state.current >= QUESTIONS.length) {
    showResult();
  } else {
    renderQuiz();
  }
}

/* ===== 结果计算 ===== */
function computeFlower() {
  var bestKey = ORDER[0];
  var bestScore = -1;
  ORDER.forEach(function (key) {
    if (state.scores[key] > bestScore) {
      bestScore = state.scores[key];
      bestKey = key;
    }
  });
  return bestKey;
}

function showResult() {
  var key = computeFlower();
  var f = FLOWERS[key];

  var idx = ORDER.indexOf(key) + 1;
  document.getElementById("result-index").textContent = "No." + (idx < 10 ? "0" + idx : idx) + " · 花谱归档";
  document.getElementById("result-name").textContent = f.name;
  document.getElementById("result-latin").textContent = f.latin;
  document.getElementById("result-img").src = f.image;
  document.getElementById("result-img").alt = f.name + "水彩图鉴";

  var lang = document.getElementById("flower-lang");
  lang.textContent = f.lang;
  lang.style.background = f.color;

  var tagsBox = document.getElementById("result-tags");
  tagsBox.innerHTML = "";
  f.tags.forEach(function (t) {
    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = t;
    tagsBox.appendChild(tag);
  });

  document.getElementById("result-profile").textContent = f.profile;
  document.getElementById("result-verdict").textContent = "「 " + f.verdict + " 」";
  document.getElementById("result-advice").textContent = f.advice;

  var name = state.ocName.trim() || "无名之花";
  document.getElementById("result-oc-name").textContent = name;

  document.getElementById("progress-bar").style.width = "100%";
  showView("view-result");
}

/* ===== 事件绑定 ===== */
document.getElementById("start-btn").addEventListener("click", function () {
  state.ocName = document.getElementById("oc-name").value;
  resetState();
  showView("view-quiz");
  renderQuiz();
});

document.getElementById("prev-btn").addEventListener("click", function () {
  if (state.current === 0) return;
  /* 回退一步：撤销上一题计分 */
  var prev = state.answers[state.current - 1];
  if (prev) {
    for (var k in prev.score) state.scores[k] -= prev.score[k];
  }
  state.current -= 1;
  renderQuiz();
});

document.getElementById("retry-btn").addEventListener("click", function () {
  resetState();
  showView("view-quiz");
  renderQuiz();
});

document.getElementById("home-btn").addEventListener("click", function () {
  resetState();
  document.getElementById("oc-name").value = "";
  showView("view-home");
});

/* 回车在首页直接开始 */
document.getElementById("oc-name").addEventListener("keydown", function (e) {
  if (e.key === "Enter") document.getElementById("start-btn").click();
});

resetState();
</script>
